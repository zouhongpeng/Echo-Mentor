name: Build APK

# 只在手动触发时打包（日常只推代码，APK 由用户自行在扣子 / 本地构建）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (android)
        working-directory: client
        run: npx expo prebuild -p android --no-install

      - name: Patch root build.gradle (SDK versions via root ext)
        working-directory: client/android
        run: |
          cat >> build.gradle <<'EOF'

          // CI patch: 部分 RN 库（如 async-storage）通过 rootProject.ext 读取 SDK 版本，
          // pnpm 布局下默认值（32）低于 RN 0.81 要求，这里统一定义
          ext {
            compileSdkVersion = 36
            targetSdkVersion = 36
            minSdkVersion = 24
          }
          EOF
          tail -12 build.gradle

      - name: Build release APK (JS bundle 内嵌，独立运行)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify JS bundle embedded
        working-directory: client/android
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "assets/index.android.bundle" || (echo "JS bundle 未打包进 APK！" && exit 1)

      - name: Rename APK
        run: |
          mkdir -p dist
          cp client/android/app/build/outputs/apk/release/app-release.apk dist/EchoMentor.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoMentor-apk
          path: dist/EchoMentor.apk

      - name: Publish to release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK 最新构建
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}
            提交：${{ github.sha }}
            
            变更见 commit message。直接下载 EchoMentor.apk 安装（需允许安装未知来源应用）。
          files: dist/EchoMentor.apk
          overwrite_files: true
