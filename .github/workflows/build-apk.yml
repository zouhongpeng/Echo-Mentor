name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (android)
        working-directory: client
        run: npx expo prebuild -p android --no-install

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp client/android/app/build/outputs/apk/debug/app-debug.apk dist/EchoMentor-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoMentor-debug-apk
          path: dist/EchoMentor-debug.apk

      - name: Publish to release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK 最新构建
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}
            提交：${{ github.sha }}
            
            变更见 commit message。直接下载 EchoMentor-debug.apk 安装（需允许安装未知来源应用）。
          files: dist/EchoMentor-debug.apk
          overwrite_files: true
